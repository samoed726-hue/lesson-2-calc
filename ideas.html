<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей</title>
  <meta name="description" content="Пять идей постов и две истории на завтра — одним нажатием.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      const saved = localStorage.getItem("ideas-theme");
      const dark = saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>
  <style>
    :root {
      --ink: #12263a;
      --muted: #3d5a73;
      --paper: #fff8ef;
      --accent: #ff4d3a;
      --accent-deep: #e63522;
      --sky: #00b4d8;
      --mist: #ffe08a;
      --line: rgba(18, 38, 58, 0.08);
      --surface: rgba(255, 255, 255, 0.82);
      --surface-hover: #ffffff;
      --border: rgba(255, 255, 255, 0.95);
      --cta-text: #ffffff;
      --orb-a: #ff6b4a;
      --orb-b: #2ec4ff;
      --orb-c: #ffd166;
      --bg-spot-a: #ffb4a2;
      --bg-spot-b: #7fdbff;
      --bg-mid: #fff3d6;
      --bg-end: #d9f4ff;
      --toggle-bg: rgba(255, 255, 255, 0.85);
      --toggle-border: rgba(18, 38, 58, 0.1);
      --tag-post: #c62818;
      --tag-post-bg: rgba(255, 77, 58, 0.18);
      --tag-story: #0277a0;
      --tag-story-bg: rgba(0, 180, 216, 0.22);
      --noise-opacity: 0.03;
      --cta-bg: linear-gradient(135deg, #ff4d3a 0%, #ff8c42 55%, #ffb703 100%);
      --cta-hover: linear-gradient(135deg, #e63522 0%, #ff7040 55%, #ffa000 100%);
      --num-bg: linear-gradient(145deg, #ff9a7a, #ff4d3a);
      --num-story-bg: linear-gradient(145deg, #7fdbff, #0096c7);
      --accent-grad: linear-gradient(120deg, #ff4d3a 0%, #ff8c42 45%, #ffb703 100%);
    }

    [data-theme="dark"] {
      --ink: #f2f7ff;
      --muted: #a8c0d8;
      --paper: #0b1624;
      --accent: #ff6b57;
      --accent-deep: #ff4d3a;
      --sky: #3dd6ff;
      --mist: #1e3a55;
      --line: rgba(242, 247, 255, 0.1);
      --surface: rgba(24, 40, 62, 0.78);
      --surface-hover: rgba(36, 58, 88, 0.95);
      --border: rgba(255, 255, 255, 0.12);
      --cta-text: #ffffff;
      --orb-a: #ff5a3c;
      --orb-b: #1fb6ff;
      --orb-c: #ffc14d;
      --bg-spot-a: #5a2218;
      --bg-spot-b: #0a3d55;
      --bg-mid: #121f30;
      --bg-end: #0a1522;
      --toggle-bg: rgba(24, 40, 62, 0.9);
      --toggle-border: rgba(255, 255, 255, 0.14);
      --tag-post: #ffb4a8;
      --tag-post-bg: rgba(255, 107, 87, 0.22);
      --tag-story: #7fdbff;
      --tag-story-bg: rgba(61, 214, 255, 0.18);
      --noise-opacity: 0.05;
      --cta-bg: linear-gradient(135deg, #ff5a3c 0%, #ff8c42 55%, #ffc107 100%);
      --cta-hover: linear-gradient(135deg, #ff4d3a 0%, #ff7040 55%, #ffb300 100%);
      --num-bg: linear-gradient(145deg, #ff8a6a, #ff4d3a);
      --num-story-bg: linear-gradient(145deg, #5ecfff, #0096c7);
      --accent-grad: linear-gradient(120deg, #ff6b57 0%, #ff9a4a 45%, #ffd166 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 65% 50% at 90% -5%, var(--bg-spot-a) 0%, transparent 55%),
        radial-gradient(ellipse 50% 45% at 0% 95%, var(--bg-spot-b) 0%, transparent 50%),
        radial-gradient(ellipse 40% 35% at 50% 40%, var(--mist) 0%, transparent 60%),
        linear-gradient(160deg, var(--bg-mid) 0%, var(--paper) 42%, var(--bg-end) 100%);
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.35s ease;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(36px);
      opacity: 0.72;
      animation: drift 18s ease-in-out infinite;
    }

    [data-theme="dark"] .orb {
      opacity: 0.45;
    }

    .orb-a {
      width: 320px;
      height: 320px;
      background: var(--orb-a);
      top: -80px;
      right: 4%;
      animation-duration: 16s;
    }

    .orb-b {
      width: 260px;
      height: 260px;
      background: var(--orb-b);
      bottom: 8%;
      left: -50px;
      animation-duration: 22s;
      animation-direction: reverse;
    }

    .orb-c {
      width: 200px;
      height: 200px;
      background: var(--orb-c);
      top: 42%;
      right: -40px;
      animation-duration: 14s;
      animation-delay: -4s;
    }

    .noise {
      position: absolute;
      inset: 0;
      opacity: var(--noise-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .theme-toggle {
      position: fixed;
      top: 1.15rem;
      right: 1.15rem;
      z-index: 10;
      width: 2.75rem;
      height: 2.75rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--toggle-border);
      border-radius: 12px;
      background: var(--toggle-bg);
      backdrop-filter: blur(10px);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(15, 39, 68, 0.08);
      transition: transform 0.25s ease, background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
      animation: rise 0.7s ease 0.1s both;
    }

    .theme-toggle:hover {
      transform: translateY(-2px) rotate(-8deg);
    }

    .theme-toggle:active {
      transform: scale(0.95);
    }

    .theme-toggle svg {
      width: 1.2rem;
      height: 1.2rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    [data-theme="dark"] .theme-toggle {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 3.5rem;
    }

    .brand {
      font-family: "Syne", sans-serif;
      font-size: clamp(2.6rem, 8vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 0.98;
      color: var(--ink);
      animation: brandIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand .accent-word {
      display: inline-block;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: wordPulse 4s ease-in-out infinite;
    }

    .underline {
      display: block;
      width: 0;
      height: 5px;
      margin-top: 0.7rem;
      border-radius: 3px;
      background: linear-gradient(90deg, #ff4d3a, #ffb703, #00b4d8);
      animation: drawLine 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
    }

    .lead {
      margin-top: 1.1rem;
      max-width: 26rem;
      font-size: 1.08rem;
      line-height: 1.55;
      color: var(--muted);
      animation: rise 0.7s ease 0.2s both;
    }

    .cta {
      position: relative;
      margin-top: 1.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.95rem 1.55rem;
      border: none;
      border-radius: 12px;
      background: var(--cta-bg);
      color: var(--cta-text);
      font: inherit;
      font-weight: 600;
      font-size: 0.98rem;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(255, 77, 58, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      animation: rise 0.7s ease 0.32s both;
    }

    .cta::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%);
      transform: translateX(-120%);
      animation: shimmer 3.2s ease-in-out infinite;
    }

    .cta:hover {
      filter: brightness(1.05);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(255, 77, 58, 0.42);
    }

    .cta:active { transform: translateY(-1px) scale(0.98); }

    .cta .spin {
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      display: none;
      animation: rotate 0.6s linear infinite;
    }

    .cta.is-loading .spin { display: block; }
    .cta.is-loading .cta-label { opacity: 0.7; }

    .empty {
      margin-top: 2.75rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--muted);
      font-size: 0.95rem;
      animation: rise 0.7s ease 0.42s both;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .empty.hidden {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      height: 0;
      margin: 0;
      overflow: hidden;
    }

    .dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 3px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; background: var(--sky); }
    .dots span:nth-child(3) { animation-delay: 0.3s; background: #ffb703; }

    .results {
      margin-top: 2.75rem;
      display: grid;
      gap: 2.25rem;
    }

    .block {
      opacity: 0;
      transform: translateY(22px);
    }

    .block.visible {
      animation: blockIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .block.delay { animation-delay: 0.14s; }

    .block h2 {
      font-family: "Syne", sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    .block h2 .tag {
      font-family: "Outfit", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tag-post);
      background: var(--tag-post-bg);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .stories-block h2 .tag {
      color: var(--tag-story);
      background: var(--tag-story-bg);
    }

    ol, ul {
      list-style: none;
      display: grid;
      gap: 0.7rem;
    }

    li {
      position: relative;
      padding: 1rem 1.15rem 1rem 3rem;
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      line-height: 1.45;
      font-size: 0.98rem;
      box-shadow: 0 4px 18px rgba(255, 77, 58, 0.06), 0 1px 0 rgba(15, 39, 68, 0.04);
      opacity: 0;
      transform: translateX(-12px);
      transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .block.visible li {
      animation: slideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    li:hover {
      border-color: rgba(255, 77, 58, 0.45);
      background: var(--surface-hover);
      transform: translateX(4px);
      box-shadow: 0 8px 22px rgba(255, 77, 58, 0.12);
    }

    .stories-block li:hover {
      border-color: rgba(0, 180, 216, 0.5);
      box-shadow: 0 8px 22px rgba(0, 180, 216, 0.12);
    }

    li::before {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.55rem;
      height: 1.55rem;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--num-bg);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .stories-block li::before {
      background: var(--num-story-bg);
    }

    ol li:nth-child(1)::before { content: "1"; }
    ol li:nth-child(2)::before { content: "2"; }
    ol li:nth-child(3)::before { content: "3"; }
    ol li:nth-child(4)::before { content: "4"; }
    ol li:nth-child(5)::before { content: "5"; }
    ul li:nth-child(1)::before { content: "А"; }
    ul li:nth-child(2)::before { content: "Б"; }

    .block.visible li:nth-child(1) { animation-delay: 0.08s; }
    .block.visible li:nth-child(2) { animation-delay: 0.14s; }
    .block.visible li:nth-child(3) { animation-delay: 0.2s; }
    .block.visible li:nth-child(4) { animation-delay: 0.26s; }
    .block.visible li:nth-child(5) { animation-delay: 0.32s; }

    .stories-block.visible li:nth-child(1) { animation-delay: 0.22s; }
    .stories-block.visible li:nth-child(2) { animation-delay: 0.3s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      40% { transform: translate(30px, 24px) scale(1.08); }
      70% { transform: translate(-18px, 12px) scale(0.95); }
    }

    @keyframes brandIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes wordPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.12); }
    }

    @keyframes drawLine {
      from { width: 0; }
      to { width: min(7.5rem, 40%); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0%, 40% { transform: translateX(-120%); }
      70%, 100% { transform: translateX(120%); }
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    @keyframes blockIn {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      main { padding: 3rem 1.15rem 2.5rem; }
      li { padding-left: 2.7rem; font-size: 0.92rem; }
    }
  </style>
</head>
<body>
  <button
    type="button"
    class="theme-toggle"
    id="themeToggle"
    title="Переключить тему"
    aria-label="Включить тёмную тему"
  >
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 14.3A9 9 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>

  <div class="atmosphere" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="noise"></div>
  </div>

  <main>
    <h1 class="brand">Генератор <span class="accent-word">идей</span></h1>
    <span class="underline" aria-hidden="true"></span>
    <p class="lead">Пять идей постов и две истории на завтра — свежая порция за одно нажатие.</p>
    <button type="button" class="cta" id="generateBtn">
      <span class="spin" aria-hidden="true"></span>
      <span class="cta-label">Сгенерировать</span>
    </button>

    <p class="empty" id="emptyHint">
      <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
      Нажмите кнопку — появятся идеи
    </p>

    <div class="results" id="results" hidden>
      <section class="block" id="postsBlock" aria-labelledby="postsTitle">
        <h2 id="postsTitle">Идеи постов <span class="tag">5 штук</span></h2>
        <ol id="postsList"></ol>
      </section>

      <section class="block stories-block" id="storiesBlock" aria-labelledby="storiesTitle">
        <h2 id="storiesTitle">Истории на завтра <span class="tag">2 штуки</span></h2>
        <ul id="storiesList"></ul>
      </section>
    </div>
  </main>

  <script>
    const POST_IDEAS = [
      "Разбор одной привычки, которая экономит час в день",
      "«До / после»: маленький эксперимент за неделю",
      "Ответы на 5 вопросов, которые вам часто пишут в директ",
      "Миф из вашей ниши — и почему он мешает",
      "Чеклист на вечер: 7 пунктов без перфекционизма",
      "История про ошибку, из которой вышли с пользой",
      "Сравнение двух подходов: что выбрать новичку",
      "Короткий гайд: с чего начать, если совсем нет времени",
      "Подборка инструментов, которыми реально пользуетесь",
      "Что бы вы сказали себе год назад — письмо в прошлое",
      "Три признака, что пора менять стратегию",
      "Разбор чужого кейса: что сработало и что нет",
      "«Один день из…» — закулисье обычного рабочего дня",
      "Вопрос аудитории + ваши честные ответы",
      "Мини-урок в карусели: шаг 1 → шаг 2 → шаг 3",
      "Что не стоит делать в первые 30 дней",
      "Личный рейтинг: топ-3 находки месяца",
      "Как объяснить сложную тему за 60 секунд",
      "Серия «мифы vs факты» по вашей теме",
      "Приглашение к диалогу: опрос с одним острым вопросом",
    ];

    const STORY_IDEAS = [
      "Утренний кадр + голос: «Сегодня пробую одну новую привычку»",
      "За кулисами подготовки: стол, заметки, чашка — без фильтров",
      "Короткий опрос в сторис: «Что вам интереснее завтра?»",
      "Таймер 15 секунд: один совет, который сработал вчера",
      "До/после мини-задачи за день — показать прогресс",
      "Ответ на комментарий — в формате истории с текстом",
      "Спойлер завтрашнего поста: одна фраза и интрига",
      "«Что в сумке / на столе» — три предмета, которые спасают день",
      "Быстрый Q&A: один вопрос — один честный ответ",
      "Напоминание о цели недели + стикер с прогрессом",
      "Момент «почти сдался, но…» — короткая история дня",
      "Скриншот идеи из блокнота + подпись «черновик»",
    ];

    function pick(arr, n) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, n);
    }

    const btn = document.getElementById("generateBtn");
    const label = btn.querySelector(".cta-label");
    const results = document.getElementById("results");
    const emptyHint = document.getElementById("emptyHint");
    const postsList = document.getElementById("postsList");
    const storiesList = document.getElementById("storiesList");
    const postsBlock = document.getElementById("postsBlock");
    const storiesBlock = document.getElementById("storiesBlock");

    function render() {
      btn.classList.add("is-loading");
      btn.disabled = true;

      postsBlock.classList.remove("visible", "delay");
      storiesBlock.classList.remove("visible", "delay");

      setTimeout(() => {
        const posts = pick(POST_IDEAS, 5);
        const stories = pick(STORY_IDEAS, 2);

        postsList.innerHTML = posts.map((t) => `<li>${t}</li>`).join("");
        storiesList.innerHTML = stories.map((t) => `<li>${t}</li>`).join("");

        emptyHint.classList.add("hidden");
        results.hidden = false;

        void postsBlock.offsetWidth;
        postsBlock.classList.add("visible");
        storiesBlock.classList.add("visible", "delay");

        label.textContent = "Ещё раз";
        btn.classList.remove("is-loading");
        btn.disabled = false;
      }, 280);
    }

    btn.addEventListener("click", render);

    const themeToggle = document.getElementById("themeToggle");

    function syncThemeLabel() {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      themeToggle.setAttribute("aria-label", dark ? "Включить светлую тему" : "Включить тёмную тему");
      themeToggle.title = dark ? "Светлая тема" : "Тёмная тема";
    }

    themeToggle.addEventListener("click", () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      if (dark) {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("ideas-theme", "light");
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("ideas-theme", "dark");
      }
      syncThemeLabel();
    });

    syncThemeLabel();
  </script>
</body>
</html>
